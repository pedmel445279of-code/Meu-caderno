<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>escolha o nivel</title>
    <style>
        body{
            background-image: url(imagens/bg.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            margin: 0;
            width: 100vw;
            height: 100vh;
        }

        #container{
             display: flex;
            justify-content: center; /* Centraliza na horizontal */
            align-items: center;     /* Centraliza na vertical */
            gap: 20px;               /* Espaço entre os blocos */
            height: 100vh;           /* Container ocupa a altura da tela */
        }

        a{
            text-decoration: none;
            color: black;
            font-size: 16px;
        }
        
        .padrao{
        background-color:aquamarine;
        margin: 20px;
        padding: 50px;
        top: 50%;
        left: 50%;
        }
    </style>
    <script>
           function escolherNivel(nivel){
                localStorage.setItem('nivel', nivel)
                window.location.href = 'index.html'
            }
    </script>

</head>
<body>
    <div id="container">

        <button class="padrao" type="button" onclick="escolherNivel('facil')"><a href="index.html">Fácil</a></button>
        <button type="button" class="padrao" onclick="escolherNivel('medio')"><a href="index.html">Médio</a></button>
        <button type="button" onclick="escolherNivel('dificil')" class="padrao"><a href="index.html">Difício</a></button>

    </div>

</body>
</html>
