<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="logica.js"></script>
</head>
<body>
    <div id="container">
        <div>
            <form action="notaImpressa.html">
                <hr>       
                <h1><u>Cadastre-se:</u></h1>
                    <span><h4>Digite aqui seu nome:</h4><input id="name" placeholder="Digite seu nome:" type="text" name="nome"></span>
                    <span><h4>Digite aqui seu CPF:</h4><input id="CPF" type="text" name="CPF" placeholder="CPF"></span>
                    <span><h4>Tada de Naciemento:</h4><input id="data" type="date" name="dataDeNacimento"></span>
                    <span><h4>Número deu seu celular:</h4><input id="numero" type="text"  placeholder="Número de celular" name="númeroCelular"></span>
                    <br><br>
                    <h3>--Endereço--</h3>
                    <span><h4>Digite aqui seu CEP:</h4><input id="CEP" type="text" name="CEP" placeholder="CEP"></span>
                    <span><h4>Digite aqui sua Rua:</h4><input id="rua" type="text" name="Rua"  placeholder="Rua"></span>
                    <span><h4>Digite aqui o número da sua casa:</h4><input id="casa" type="text" name="Número"  placeholder="Número"></span>
                    <span><h4>Digite aqui um complemento:</h4><input type="text" id="complemento" name="complemento"  placeholder="Complemento"></span>
                    <span><h2>Enviar dados</h2><a href="notaImpressa.html"><button type="submit" onclick="dadosCadastro()" id="dadosPessoais">Cadastrar Dados</button></a></span>
            </form>
        </div>
    </div>
</body>
</html>
