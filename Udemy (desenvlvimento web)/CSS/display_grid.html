<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        body{
            font-size: 3rem;
            background-color: black;
            color: aliceblue;
            border: 1px solid green;
        }

        .grid{
            display: grid;
            grid-template-columns: repeat(3, 1fr)
            

        }


        .grid > div {
            margin: 20px;
            border: 1px solid red;
        }

        /*
            GRID: COLUNAS

            grid-template-columns: repeat(quantidade de colunas, tamanho da colunas em px ou %)
            grid-template-columns: repeat(3, 200px)

            numeroFR: e o tamanho fracionado
        */

        /*
            GRID: LINHAS
            grid-templete-rows: repeat(quantidade de linhas, tamanho das linhas)
        */

        /*
        GRID: GAP

        gap: tamanho do espaçamento entre os elementos;

        gap: 10px;
        gap: 15px;
        */
            

    </style>
</head>
<body>

    <div class="grid">
        <div class="item1">1</div>
        <div class="item2">2</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
        <div class="item6">6</div>
        <div class="item7">7</div>
        <div class="item8">8</div>
        <div class="item8">8</div>
        <div class="item9">9</div>
        <div class="item10">10</div>
    </div>
    
</body>
</html>
