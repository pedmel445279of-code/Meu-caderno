<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    function tabuada(){
        let b=Number(prompt("Digite um número que queira multiplicar:"))
        for(let a=1; a<=100; ++a){
            document.write(b +" X "+a + " = " + (b*a) + '<br>')
        }
    }
    tabuada()
</script>
</html>
