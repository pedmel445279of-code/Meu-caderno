<script>
   
   function primos(){
    for(let a = 2; a <= 100; a++){
        let primo = true
        for(let b = 2; b < a; b++){
            if(a % b === 0){
                primo = false
                break
            }
        }
        if(primo === true){
            document.write(a + '<br>')
        }
    }
}
primos()

</script>
