<script>

//OBS:Nessa logica as duas variaveis são criadas dentro da função, uma pra armazenar o valor e a outra é pra fazer a soma,no começo do laço eu peço pra
//somar o valor no b(armazena) mas o numero que se repete e no documento eu mostro a variavel que esta armazenando.

    function cadeiaNumeros(){
        let b = 0
        let a = 1
        while(a <=100 ){
            b +=a
            ++a
            document.write(b + '<br>')
        }
    }
    cadeiaNumeros()
    //document.write(b)
    
</script>
